# Copy to ~/.config/shadow-agent/config.yaml, or let ShadowCode create it on
# first run. Read or set single keys with `shadowcode config KEY [VALUE]`.
# Never put API keys in this file. Name the environment variable instead.
# The desktop picker chooses the model for each conversation. This block is
# the fallback for the CLI and for HTTP endpoints (native agent loop).

model:
  default: mock
  provider: mock
  # Compatible HTTP endpoints (used through `shadowcode models` / `run --model`):
  #   grok:     provider openai_compatible, endpoint https://api.x.ai/v1, api_key_env XAI_API_KEY
  #   openai:   provider openai_compatible, endpoint https://api.openai.com/v1, api_key_env OPENAI_API_KEY
  #   ollama:   provider ollama, endpoint http://127.0.0.1:11434/v1
  #   llamacpp: provider llamacpp, endpoint http://127.0.0.1:8080/v1 (an external server;
  #             GGUF rows under local_engine use the bundled runtime instead)
  #   vllm:     provider vllm, endpoint http://127.0.0.1:8000/v1
  # Subscriptions are picker ids such as cli:codex or cli:cursor:auto.
  endpoint: ""
  api_key_env: OPENAI_API_KEY
  name: mock-coder
  context_limit: 16384
  keep_alive: "30m"  # Ollama endpoints only: duration, "0" to unload, "-1" indefinite

permissions:
  # mode: ask            # ask ("Ask before actions") | allow_edits ("Allow project edits").
  #                      # Onboarding writes ask; a config without a mode is migrated from level.
  level: workspace          # advanced: read_only | workspace | elevated
  require_approval_for_dangerous: true
  network: false            # let shell commands that reach the network run (after approval)
  allow_root: false         # sudo/su/pkexec/doas/run0 still ask when true

# network:
#   mode: online           # online | web_off (no web tools) | offline (local models only,
#                          # no vendor status/usage checks, cloud jobs refused)
#   allow_local_dev: []    # exact host:port entries web tools may reach, e.g. localhost:3000
#   searxng_url: ""        # your own SearXNG base URL; web_search asks it before DuckDuckGo
#   shell: on              # shell commands: on | off | allowlist (only when permissions.network is true)
#   allow: []              # allowlist hosts: example.com, *.example.com, host:port (default ports 80/443)

# Shell sandbox (bubblewrap). Home is an empty temporary folder in the sandbox.
# sandbox:
#   require: false         # true: refuse shell commands when bubblewrap is unavailable
#   landlock: true         # without bubblewrap, restrict files (and TCP) with Landlock
#   home_binds: [.cargo, .rustup, .nvm, .npm, .cache/pip, .local/bin, .gitconfig, .pyenv, .bun, .deno]
#                          # read-only; .ssh, .aws, .gnupg, .config, .local/share, ... are refused

# Project checkpoints around shell commands and subscription CLI turns (for Rewind).
# checkpoints:
#   shell: true
#   vendor: true
#   keep: 200              # refs kept under refs/shadowcode/checkpoints in each repository
#   max_copy_files: 5000   # folders without Git: larger folders are not covered
#   max_copy_bytes: 67108864

# Subscriptions (vendor CLIs). Settings › Advanced › Vendor tools edits these.
# cli_agents:
#   enabled: true
#   claude_enabled: true
#   codex_binary: codex
#   claude_binary: claude
#   cursor_binary: cursor-agent
#   antigravity_binary: agy
#   grok_binary: grok
#   approval_timeout_sec: 600   # unanswered vendor approvals are denied
#   stall_timeout_sec: 900      # no output for this long stops the vendor process

# Local GGUF models. Settings › Local models edits the lists; weights are never
# copied or deleted.
# local_engine:
#   directories: []
#   files: []
#   imports: []            # Ollama store models registered by reference
#   excluded: []
#   llama_binary: ""       # explicit llama-server; default is the bundled/managed runtime
#   context_size: 0        # upper bound for the server context; 0 = 16384

# Update notice (Settings › About): at most once a day ask GitHub for the
# newest release; the request carries no version or identifier. Offline mode
# pauses it. Unset follows the packaged default (on unless the distribution
# turned it off in /etc/shadowcode/policy.yaml; see docs/DISTRIBUTING.md).
# updates:
#   check: true

git:
  auto_commit: false
  allow_destructive: false

# Spending limits for paid API models (OpenRouter and other per-token
# endpoints; never subscriptions or models on this computer). At a limit the
# task pauses between steps and asks to continue (limit raised one step) or
# stop. null turns a limit off. `shadowcode run --max-cost USD` sets one
# task's limit.
spending:
  task_usd: 1.0     # one task, subagents included
  daily_usd: 10.0   # all tasks and projects together; resets at local midnight

# The app log for bug reports: ~/.local/state/shadow-agent/logs/shadowcode.log,
# 5 MB x 3 files, secrets redacted; events, errors and timings, never prompts
# or file contents. error | warn | info | debug
logging:
  level: info

ui:
  host: 127.0.0.1         # unused by the native app (kept for older configs)
  port: 7430              # unused by the native app (kept for older configs)
  theme: light            # system | light | dark (desktop appearance)
  ability: none           # legacy capability preference; does not grant OS permissions
  notify: true            # desktop notification when a long task finishes
  notify_after_sec: 4.0   # only notify for jobs longer than this

agent:
  max_steps: 32
  tool_timeout_sec: 60
  parallel_reads: true
  model_retries: 3          # retry 429/5xx/overloaded and dropped streams (0-10)
  retry_backoff_sec: 1.0    # exponential backoff base, with jitter; Retry-After wins
  summary_compaction: true  # let the model summarize history dropped to fit the context
  summary_timeout_sec: 60   # longest wait for that summary before the built-in digest

onboarding:
  completed: false
  workspace: ""

# Folders tasks may run in. Managed by the trust dialog.
trusted_workspaces: []

# Advanced: per-purpose models for tasks started without an explicit model
# (CLI, goals). The desktop always sends the picker's choice.
routing:
  enabled: false
  planner: mock
  coder: mock
  reviewer: mock
  tester: mock

mcp:
  servers: []
