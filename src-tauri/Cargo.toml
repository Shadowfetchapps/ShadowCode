[package]
name = "shadowcode-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Shadowfetch <209457103+Shadowfetchapps@users.noreply.github.com>"]
description = "A native workspace for local coding models"

[[bin]]
name = "shadowcode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shadowcode-core = { path = "../native/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["signal"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Clickable notifications on Linux (the notification plugin cannot report
# a click on desktop); the same crate the plugin already uses.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
# Whether GTK opened a Wayland or an X11 display (the window's first size);
# the same crate tao already uses.
gdk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
