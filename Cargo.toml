[workspace]
members = ["native/core", "src-tauri"]
default-members = ["native/core"]
exclude = ["vendor/glib-0.18.5"]
resolver = "2"

[workspace.package]
version = "0.34.1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Shadowfetchapps/ShadowCode"

[patch.crates-io]
# GTK3/WebKit still require 0.18. Preserve that API with the upstream UB fix.
# See vendor/glib-0.18.5.README.md for provenance and verification.
glib = { path = "vendor/glib-0.18.5" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
