model:
  default: mock
  provider: local
  endpoint: http://127.0.0.1:34591/v1
  api_key_env: SHADOWCODE_FIXTURE_KEY
  name: fixture-coder
  context_limit: 16384
  keep_alive: 30m
permissions:
  mode: allow_edits
  level: workspace
  require_approval_for_dangerous: true
  network: false
  allow_root: false
  approve_shell: false
agent:
  max_steps: 12
  tool_timeout_sec: 60
  parallel_reads: true
  compact_ratio: 0.7
  model_retries: 3
  retry_backoff_sec: 1.0
  max_fix_retries: 3
  max_output_bytes: 256000
  max_task_tokens: 1000000
  autonomy_profile: normal
  summary_compaction: true
  summary_timeout_sec: 60
  stuck_check: true
ui:
  notify: false
  notify_approval: true
  notify_failed: true
  notify_finished: true
  notify_limit: true
  notify_sound: false
  theme: dark
onboarding:
  completed: true
  workspace: @ROOT@/project
routing:
  architecture: ''
  coder: ''
  enabled: false
  local: ''
  planner: ''
  reviewer: ''
  small_edits: ''
  tester: ''
  vision: ''
mcp:
  approved: []
  servers: []
  share_with_cli_agents: true
hooks:
  approved: []
verification:
  commands: []
trusted_workspaces:
- @ROOT@/project
guardian:
  allow_prepare_patch: false
  enabled: false
  interval_sec: 3600
cli_agents:
  enabled: true
  claude_enabled: true
  codex_binary: codex
  grok_binary: grok
  claude_binary: claude
  cursor_binary: cursor-agent
  antigravity_binary: agy
  approval_timeout_sec: 600
  stall_timeout_sec: 900
  max_run_time_sec: 7200
local_engine:
  directories: []
  files: []
  imports: []
  excluded: []
  llama_binary: ''
  context_size: 0
network:
  mode: online
  shell: on
  allow: []
  allow_local_dev: []
  searxng_url: ''
sandbox:
  require: false
  home_binds:
  - .cargo
  - .rustup
  - .nvm
  - .npm
  - .cache/pip
  - .local/bin
  - .gitconfig
  - .pyenv
  - .bun
  - .deno
  landlock: true
checkpoints:
  shell: true
  vendor: true
  keep: 200
  max_copy_files: 5000
  max_copy_bytes: 67108864
limits:
  fallback_model: ''
  on_limit: local
spending:
  task_usd: 1.0
  daily_usd: 10.0
logging:
  level: info
updates:
  check: null
a_setting_from_the_future:
  kept: true
code_intel:
  diagnostics_on_edit: true
  diagnostics_wait_ms: 3000
  embedding_model: ''
  lsp: true
  lsp_idle_minutes: 10
  max_servers: 4
  repo_map_tokens: 1024
  semantic_search: true
  servers: {}
subagents:
  enabled: true
  max_depth: 1
  max_parallel: 4
  max_per_task: 16
  max_turns: 24
voice:
  engine: local
  language: en
  live_preview: true
  max_seconds: 120
  model: base.en
  openrouter_model: google/gemini-3.1-flash-lite
  voice_commands: true
