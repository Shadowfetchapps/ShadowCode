[package]
name = "shadowcode-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "cache", "hooks", "limits", "fallible_uint"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
flate2 = "1"
tempfile = "3"
regex = "1"
ignore = "0.4"
fs2 = "0.4"
libc = "0.2"
tracing = "0.1"
cap-std = "3"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "transport-streamable-http-client", "transport-streamable-http-server"] }
sse-stream = "=0.2.6"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
# Level-triggered terminal polling preserves input readiness across resize events.
crossterm = { version = "=0.29.0", default-features = false, features = ["event-stream", "bracketed-paste", "use-dev-tty"] }
unicode-segmentation = "1"
unicode-width = "0.2"
base64 = "0.22"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Extra grammars for the code index (Python, Go, C, C++, Java). All build on
# tree-sitter-language 0.1, the same ABI bridge the Rust and TypeScript grammars use.
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
# Shell commands are parsed before approval (approvals::shell). MIT.
tree-sitter-bash = "0.25"
# Reading Cargo.toml, pyproject.toml and lockfiles for new dependencies
# (supply_chain). Already built for the desktop app.
toml = "=0.9.12"
# API keys in the desktop keyring: the freedesktop Secret Service over
# D-Bus (keyring.rs). The same zbus the desktop app already builds.
# MIT.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
streaming-iterator = "0.1.9"
# Pairing QR codes for remote access (Settings › Remote access and
# `shadowcode serve --remote`). MIT OR Apache-2.0, no dependencies.
qrcode = { version = "=0.14.1", default-features = false }
# Automation schedules: local wall-clock times (daylight saving included).
# Already in the dependency tree through rmcp/schemars; MIT OR Apache-2.0.
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
# Voice input: whisper.cpp (MIT, compiled from the sources inside
# whisper-rs-sys; the Rust bindings are Unlicense) for local dictation, CPU
# only. Pinned so the vendored whisper.cpp revision only changes on purpose.
whisper-rs = { version = "=0.16.0", default-features = false }
# `shadowcode completions <shell>` and the packaged man page
# (`shadowcode manpage`), generated from the same clap definitions as --help.
# MIT OR Apache-2.0; roff is their only new dependency.
clap_complete = "=4.6.11"
clap_mangen = "=0.2.33"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock file/TCP restrictions for shell commands that run without
# bubblewrap. Pinned: it builds the ruleset; the forked child only calls
# landlock_restrict_self on the resulting fd.
landlock = "=0.4.7"
# Voice input: microphone capture through ALSA (PipeWire and PulseAudio
# provide the default ALSA device on desktop Linux). Apache-2.0.
cpal = { version = "=0.18.2", default-features = false }

[dev-dependencies]
# The same tokio, with its paused test clock (no new crate).
tokio = { version = "1", features = ["full", "test-util"] }
